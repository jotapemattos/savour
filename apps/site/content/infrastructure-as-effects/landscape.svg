<rect x="870" y="528" width="260" height="60" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="1000.0" y="565.0" font-size="20" font-weight="700" text-anchor="middle" fill="#111">Deploy</text>
<line x1="330" y1="558" x2="466" y2="558" stroke="#111" stroke-width="2" marker-end="url(#head)"/>
<line x1="730" y1="558" x2="866" y2="558" stroke="#111" stroke-width="2" marker-end="url(#head)"/>
<text x="600.0" y="686" font-size="19" font-weight="500" text-anchor="middle" fill="#111">The compiler checks these relationships before deployment.</text>
