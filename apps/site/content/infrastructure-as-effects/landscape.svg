<line x1="50" y1="486" x2="1150" y2="486" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="70" y="516" width="260" height="84" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
