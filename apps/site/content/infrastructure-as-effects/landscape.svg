<text x="600.0" y="438.0" font-size="14" font-weight="400" text-anchor="middle" fill="#555">permissions + configuration</text>
<rect x="870" y="376" width="260" height="84" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
