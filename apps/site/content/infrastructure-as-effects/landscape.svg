<text x="950.0" y="201.6" font-size="16" font-weight="500" text-anchor="middle" fill="#111">HTTP</text>
<rect x="760" y="220" width="380" height="32" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="950.0" y="241.6" font-size="16" font-weight="500" text-anchor="middle" fill="#111">MCP tools</text>
<rect x="760" y="260" width="380" height="32" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
