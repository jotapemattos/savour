<text x="600.0" y="52" font-size="32" font-weight="800" text-anchor="middle" fill="#111">Infrastructure as Effects</text>
<rect x="30" y="84" width="1140" height="560" rx="18" fill="none" stroke="#ff1493" stroke-width="3"/>
<text x="56" y="116" font-size="16" font-weight="700" text-anchor="start" fill="#111">One Effect program</text>
