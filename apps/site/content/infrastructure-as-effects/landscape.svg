<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Infrastructure as Effects</title><desc id="d">One Effect program holds three lanes. A contract projects to command line, HTTP, MCP tools, browser RPC and code mode. Code requires bindings, which declare resources. Plan, review and deploy run in order. The compiler checks these relationships before deployment.</desc>
