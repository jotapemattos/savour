<rect x="70" y="198" width="240" height="84" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="190.0" y="236.0" font-size="20" font-weight="700" text-anchor="middle" fill="#111">Contract</text>
<text x="190.0" y="260.0" font-size="14" font-weight="400" text-anchor="middle" fill="#555">input, output, failures</text>
<rect x="492.0" y="163" width="96" height="22" fill="#fff"/><text x="540" y="179" font-size="15" font-weight="400" text-anchor="middle" fill="#555" font-style="italic">projection</text>
<line x1="50" y1="352" x2="1150" y2="352" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6 6"/>
