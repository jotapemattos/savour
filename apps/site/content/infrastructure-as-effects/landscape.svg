<text x="200.0" y="578.0" font-size="14" font-weight="400" text-anchor="middle" fill="#555">changes before they apply</text>
<rect x="470" y="528" width="260" height="60" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
